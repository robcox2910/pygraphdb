site_name: PyGraphDB
site_url: https://robcox2910.github.io/pygraphdb/
site_description: "Build your own graph database in Python: nodes, edges, traversal, shortest paths and a Cypher-like query language, explained for learners."
repo_url: https://github.com/robcox2910/pygraphdb
repo_name: robcox2910/pygraphdb

# theme:start
theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - search.highlight

# Social cards need cairo, so they are off unless SOCIAL_CARDS is set (the
# shared docs workflow sets it). A repo must not add its own plugins key.
plugins:
  - search
  - social:
      enabled: !ENV [SOCIAL_CARDS, false]
# theme:end

exclude_docs: |
  superpowers/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables

nav:
  - Home: index.md
  - Edges -- Friendships and Handshakes: concepts/edges.md
  - Pattern Matching -- Finding Friends Who Like Pizza: concepts/matching.md
  - Nodes -- People at a Party: concepts/nodes.md
  - Pathfinding -- GPS Directions: concepts/pathfinding.md
  - Persistence -- Saving Your Graph: concepts/persistence.md
  - Queries -- Asking Questions About Your Network: concepts/queries.md
  - Traversal -- Exploring a Maze: concepts/traversal.md
  - Property Testing -- The Town Surveyor: property-testing.md
  # series-nav:start
  - The series:
      - Series home: https://robcox2910.github.io/
      - PyOS: https://robcox2910.github.io/py-os/
      - Pebble: https://robcox2910.github.io/pebble-lang/
      - PyDB: https://robcox2910.github.io/pydb/
      - PyKV: https://robcox2910.github.io/pykv/
      - PyDocDB: https://robcox2910.github.io/pydoc-db/
      - "[You are here] PyGraphDB": https://robcox2910.github.io/pygraphdb/
      - PyTSDB: https://robcox2910.github.io/pytsdb/
      - PyVecDB: https://robcox2910.github.io/pyvecdb/
      - PyColDB: https://robcox2910.github.io/pycoldb/
      - PyCrypt: https://robcox2910.github.io/pycrypt/
      - PyNet: https://robcox2910.github.io/pynet/
      - PyWeb: https://robcox2910.github.io/pyweb/
      - PyGit: https://robcox2910.github.io/pygit/
      - PySearch: https://robcox2910.github.io/pysearch/
      - PyMQ: https://robcox2910.github.io/pymq/
      - PyLLM: https://robcox2910.github.io/pyllm/
      - PyStack: https://robcox2910.github.io/pystack/
  # series-nav:end
